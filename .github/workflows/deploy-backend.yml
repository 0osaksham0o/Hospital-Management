name: Deploy Backend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hospital_Management

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat > ~/.ssh/config <<EOF
          Host backend
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Upload jar
        run: |
          scp target/hospital-management-1.0.0.jar backend:/tmp/hospital-backend.jar

      - name: Restart backend
        run: |
          ssh backend << 'EOF'
            sudo mv /tmp/hospital-backend.jar /opt/hospital/backend/app.jar
            sudo chown ubuntu:ubuntu /opt/hospital/backend/app.jar
            sudo systemctl restart hospital-backend
            sudo systemctl status hospital-backend --no-pager
          EOF
