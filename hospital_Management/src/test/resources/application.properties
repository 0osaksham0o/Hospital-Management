# ─── Test DataSource (H2 in MySQL mode) ───────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=PROCEDURE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# Auto-create schema from entities, drop on exit
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Preserve exact @Column(name=...) values – no CamelCase→snake_case conversion
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable quoted identifiers for H2 – H2 handles names without quoting in MySQL mode
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Spring Data REST ─────────────────────────────────────────────────────────
spring.data.rest.base-path=/api
spring.data.rest.default-page-size=5
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true
spring.data.rest.default-media-type=application/json

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=hospital-management
server.port=8082
spring.jpa.open-in-view=false
