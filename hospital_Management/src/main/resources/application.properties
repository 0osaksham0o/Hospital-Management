# Server Configuration
server.port=8082

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://hms.cfuqkws8o4bb.ap-south-1.rds.amazonaws.com:3306/hms
spring.datasource.username=admin
spring.datasource.password=Admin12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
# maxLifetime < AWS RDS wait_timeout (8h) to prevent "connection closed" errors
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Use standard naming: preserve exact @Column(name=...) values, no CamelCase→snake_case conversion
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Quote all identifiers so MySQL reserved words (e.g. 'Procedure', 'Date') don't cause DDL errors
spring.jpa.properties.hibernate.globally_quoted_identifiers=true


# Disable open-in-view to avoid lazy-loading issues during view rendering
spring.jpa.open-in-view=false

# Application Name
spring.application.name=hospital-management

# Jackson (JSON formatting)
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Spring Data REST
spring.data.rest.base-path=/api
spring.data.rest.default-page-size=5
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true
spring.data.rest.default-media-type=application/json